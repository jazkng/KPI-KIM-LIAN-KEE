<!doctype html><html lang="zh-Hans"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电脑界面预览 · 御膳智控</title><style>*{box-sizing:border-box}body{margin:0;background:#dde3e0;font-family:system-ui,"Microsoft YaHei",sans-serif;color:#23372d}header{padding:12px 16px;background:#fff;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #ccd5ce;position:sticky;top:0;z-index:2}b{font-size:14px}a,button{font:inherit;font-size:12px;padding:10px 12px;border:1px solid #cfd8d0;border-radius:7px;background:#fff;color:#334c3d;text-decoration:none;cursor:pointer}button.active{background:#243d31;color:#fff}p{font-size:11px;margin:0;color:#718477;width:100%}#screen{overflow:auto;padding:14px}#frame-wrap{position:relative;margin:auto;overflow:hidden;box-shadow:0 5px 25px #243d3120;border-radius:8px;background:#fff}iframe{width:1366px;height:940px;border:0;transform-origin:top left;display:block}</style><header><b>电脑界面 · 1366 像素</b><button id="fit" class="active">适合窗口</button><button id="full">原尺寸</button><a href="index.html">手机／自动预览</a><p>电脑布局已固定。可点「原尺寸」放大查看，再左右滑动。</p></header><div id="screen"><div id="frame-wrap"><iframe src="index.html" title="电脑版经营工作台"></iframe></div></div><script>let fit=true;const wrap=document.querySelector('#frame-wrap'),frame=document.querySelector('iframe');function resize(){const s=fit?Math.min(1,(innerWidth-28)/1366):1;wrap.style.width=1366*s+'px';wrap.style.height=940*s+'px';frame.style.transform='scale('+s+')';document.querySelector('#fit').classList.toggle('active',fit);document.querySelector('#full').classList.toggle('active',!fit)}document.querySelector('#fit').onclick=()=>{fit=true;resize()};document.querySelector('#full').onclick=()=>{fit=false;resize()};addEventListener('resize',resize);resize();</script></html>
