# 御膳智控 ERP · CI（只做检查，不做任何部署）
#
# - 不使用任何 GitHub Secrets，不连接正式 Firebase / Cloud Run / AI Studio
# - Firestore Rules 测试只在本机 Emulator（demo- 项目）运行
name: CI

on:
  pull_request:
    branches: [develop-v2, main]
  push:
    branches: [develop-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: TypeScript · 单元测试 · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: 安装依赖（严格按 bun.lock）
        run: bun install --frozen-lockfile
      - name: TypeScript 类型检查
        run: npm run lint
      - name: 单元测试
        run: npm test
      - name: 生产构建（不注入任何正式环境变量）
        run: npm run build

  rules:
    name: Firestore Rules（Emulator）
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: 缓存 Emulator
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-15.33.0
      - name: 安装依赖（严格按 bun.lock）
        run: bun install --frozen-lockfile
      - name: Rules 测试
        run: npm run test:rules

  secrets:
    name: 密钥扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks（扫描完整 git 历史，结果脱敏）
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
