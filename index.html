<!DOCTYPE html>
<html lang="en" class="fixed-layout">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>御膳智控 ERP</title>
    
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#FFD200" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="御膳智控">
    
    <link rel="apple-touch-icon" href="https://i.imgur.com/ex06Jva.png">
    <link rel="icon" type="image/png" href="https://i.imgur.com/ex06Jva.png" />
    <link rel="shortcut icon" type="image/png" href="https://i.imgur.com/ex06Jva.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&family=Noto+Serif+SC:wght@700;900&display=swap" rel="stylesheet">

    <script type="importmap">
      {
        "imports": {
          "react/": "https://aistudiocdn.com/react@^19.2.0/",
          "react": "https://aistudiocdn.com/react@^19.2.0",
          "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
          "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
          "jspdf": "https://esm.sh/jspdf@2.5.1",
          "html2canvas-pro": "https://esm.sh/html2canvas-pro@2.2.3",
          "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
          "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js",
          "firebase/": "https://esm.sh/firebase@^12.7.0/"
        }
      }
    </script>

    <style>
      /* 首屏防闪样式 */
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #F6F7FB;
      }

      /* 深度锁定 iOS 弹性回弹 (Rubber-banding) */
      html, body {
        position: fixed;
        overflow: hidden;
      }

      #root {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        height: 100%;
        height: -webkit-fill-available; 
        
        overflow-y: auto;
        overflow-x: hidden;
        
        overscroll-behavior: contain; 
        -webkit-overflow-scrolling: touch;
      }

      /* 全局滚动条美化 */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #F6F7FB;
      }
      ::-webkit-scrollbar-thumb {
        background: #E5E7EB;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #FFD200;
      }

      * {
        box-sizing: border-box;
      }

      /* iOS Safe Area & HIG Touch Target Utilities */
      .safe-area-top {
        padding-top: calc(10px + env(safe-area-inset-top, 0px)) !important;
      }
      .safe-area-bottom {
        padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px)) !important;
      }
      
      @media (min-width: 768px) {
        .safe-area-top {
          padding-top: calc(16px + env(safe-area-inset-top, 0px)) !important;
        }
        .safe-area-bottom {
          padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)) !important;
        }
      }

      /* Make sure all touch elements have active state without click-delay on iOS */
      button, a, [role="button"] {
        -webkit-tap-highlight-color: transparent;
        touch-action: manipulation;
      }

      @keyframes html-spinner {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body class="bg-[#F6F7FB] text-[#111111] antialiased selection:bg-[#FFD200] selection:text-[#111111]">
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; background-color: #F6F7FB; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
          <!-- 黄色品牌 Logo 容器 -->
          <div style="width: 80px; height: 80px; background-color: #FFD200; border-radius: 9999px; display: flex; align-items: center; justify-content: center; padding: 4px; box-shadow: 0 4px 14px 0 rgba(255, 210, 0, 0.3);">
            <img src="https://i.imgur.com/ex06Jva.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;" />
          </div>
          <!-- 黑色 Spinner -->
          <div style="width: 32px; height: 32px; border: 4px solid rgba(17, 17, 17, 0.1); border-top-color: #111111; border-radius: 50%; animation: html-spinner 1s linear infinite;"></div>
          <p style="margin: 0; font-family: 'Inter', sans-serif; font-size: 11px; color: #111111; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase;">LOADING</p>
        </div>
      </div>
    </div>

    <script type="module" src="/index.tsx"></script>
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('SW registered', reg))
            .catch(err => console.log('SW failed', err));
        });
      }

      // 针对 iOS 的补充逻辑：防止触摸移动穿透到 body
      document.addEventListener('touchmove', function (e) {
          if (e.target.id === 'root' || document.getElementById('root').contains(e.target)) {
              // 允许 root 内部滚动
          } else {
              e.preventDefault();
          }
      }, { passive: false });
    </script>
  </body>
</html>
