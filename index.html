<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>金莲记EPR</title>
    
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#780d16" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="金莲记EPR">
    
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="shortcut icon" type="image/png" href="/icons/icon-192.png" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!--
      字重必须覆盖代码里实际用到的范围，否则浏览器会拿邻近字重顶替：
      Inter 若不加载 700/900，font-bold 和 font-black 会双双落到 800，
      粗细层级失效，且文字宽度与布局预期不符（PDF 导出时会挤出换行和重叠）。
      用 `300..900` 区间语法拿到可变字体，单文件覆盖全字重，比拆成多个静态字重更省。

      👑 字体家族必须与 styles.css 里 --font-sans 实际声明的一致：
      之前这里加载的是 "Noto Serif SC"，但 --font-sans 的中文后备字体是
      "Noto Sans SC"——两者是完全不同的字体，从未被加载过的 "Noto Sans SC"
      永远不会被浏览器解析到，中文只能落到系统默认字体（Windows/服务器上
      往往是无衬线但字宽表完全不同的替代字体）。html2canvas 量字宽时用的
      是这个未被预热、未必稳定的后备字体，画的时候字体又可能刚好加载完成，
      两次量出的宽度对不上——这正是导出 PDF 里中文和数字被"挤"在一起的根因。
    -->
    <!--
      📱 字体改成「不挡画面」：以前这条是会阻塞渲染的 stylesheet，
      iPhone 网络慢、或连不上 Google Fonts 时，整个画面要等它载完才出来（看起来像卡住）。
      现在先用系统字体显示，字体到了再换上；PDF 导出前本来就会等字体（waitForPdfFonts）。
    -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=JetBrains+Mono:wght@400..800&family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=JetBrains+Mono:wght@400..800&family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=JetBrains+Mono:wght@400..800&family=Noto+Sans+SC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"></noscript>

    <!--
      首屏防闪样式：只保留 styles.css 加载完成前、加载动画本身需要的规则。
      其余全局样式（滚动条、safe-area、触控优化等）统一由 styles.css 负责，
      避免同一份 CSS 在两处维护出现分叉。
    -->
    <style>
      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        min-height: 100%;
        background: #F6F7FB;
      }

      /* 深度锁定 iOS 弹性回弹 (Rubber-banding) */
      html, body {
        position: fixed;
        overflow: hidden;
      }

      #root {
        position: absolute;
        inset: 0;
        height: 100%;
        overflow-y: auto;
        overflow-x: hidden;
      }

      @keyframes html-spinner {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>

  <body class="bg-[#F6F7FB] text-[#111111] antialiased selection:bg-[#FFD200] selection:text-[#111111]">
    <div id="root">
      <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; background-color: #F6F7FB; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: 9999;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
          <!-- 黄色品牌 Logo 容器 -->
          <div style="width: 80px; height: 80px; background-color: #FFD200; border-radius: 9999px; display: flex; align-items: center; justify-content: center; padding: 4px; box-shadow: 0 4px 14px 0 rgba(255, 210, 0, 0.3);">
            <img src="/icons/icon-192.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;" />
          </div>
          <!-- 黑色 Spinner -->
          <div style="width: 32px; height: 32px; border: 4px solid rgba(17, 17, 17, 0.1); border-top-color: #111111; border-radius: 50%; animation: html-spinner 1s linear infinite;"></div>
          <p style="margin: 0; font-family: 'Inter', sans-serif; font-size: 11px; color: #111111; font-weight: 800; letter-spacing: 0.2em; text-transform: uppercase;">LOADING</p>
        </div>
      </div>
    </div>

    <script type="module" src="/index.tsx"></script>
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('sw.js')
            .then(reg => console.log('SW registered', reg))
            .catch(err => console.log('SW failed', err));
        });
      }

      // 针对 iOS 的补充逻辑：只挡「直接拖 body / html」造成的整页回弹。
      // ⚠️ 以前是「不在 #root 里面就全部挡掉」，但很多弹窗是用 createPortal 挂在 body 下，
      //    结果 iPhone 上那些弹窗完全滑不动，看起来像卡死。
      document.addEventListener('touchmove', function (e) {
          if (e.target === document.body || e.target === document.documentElement) {
              e.preventDefault();
          }
      }, { passive: false });
    </script>
  </body>
</html>
